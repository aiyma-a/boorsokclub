<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <pattern id="rice" width="36" height="28" patternUnits="userSpaceOnUse">
      <rect width="36" height="28" fill="#F6E7C4"/>
      <ellipse cx="7" cy="7" rx="6" ry="2.6" fill="#FFF8E6" transform="rotate(-25 7 7)"/>
      <ellipse cx="24" cy="5" rx="6" ry="2.6" fill="#E9D3A2" transform="rotate(20 24 5)"/>
      <ellipse cx="15" cy="17" rx="6" ry="2.6" fill="#FFF8E6" transform="rotate(10 15 17)"/>
      <ellipse cx="31" cy="21" rx="6" ry="2.6" fill="#FFF8E6" transform="rotate(-40 31 21)"/>
      <ellipse cx="4" cy="24" rx="6" ry="2.6" fill="#E9D3A2" transform="rotate(35 4 24)"/>
    </pattern>
    <clipPath id="pot">
      <path d="M112 312 L488 312 Q478 478 300 486 Q122 478 112 312 Z"/>
    </clipPath>
    <!-- kochkor muiuz: ram's horn motif -->
    <g id="horn" fill="none" stroke="#F4E6CC" stroke-width="5" stroke-linecap="round">
      <path d="M0 16 L0 0 C0 -14 -18 -18 -20 -6 C-21 3 -11 5 -10 -2"/>
      <path d="M0 0 C0 -14 18 -18 20 -6 C21 3 11 5 10 -2"/>
    </g>
  </defs>


  <!-- die-cut white border -->
  <g filter="url(#shadow)" fill="#fff" stroke="#fff" stroke-width="44" stroke-linejoin="round">
    <path d="M120 300 Q150 175 300 165 Q450 175 480 300 Z"/>
    <circle cx="300" cy="150" r="40"/>
    <rect x="92" y="290" width="416" height="34" rx="17"/>
    <path d="M112 312 L488 312 Q478 478 300 486 Q122 478 112 312 Z"/>
  </g>

  <!-- rice mound -->
  <path d="M120 300 Q150 175 300 165 Q450 175 480 300 Z" fill="url(#rice)" stroke="#3A1F1A" stroke-width="9" stroke-linejoin="round"/>
  <!-- carrot strips -->
  <g stroke="#E8792B" stroke-width="9" stroke-linecap="round">
    <line x1="170" y1="270" x2="200" y2="255"/>
    <line x1="235" y1="215" x2="262" y2="228"/>
    <line x1="330" y1="222" x2="360" y2="210"/>
    <line x1="395" y1="262" x2="420" y2="278"/>
    <line x1="285" y1="268" x2="312" y2="258"/>
    <line x1="215" y1="285" x2="240" y2="290"/>
    <line x1="360" y1="285" x2="385" y2="280"/>
  </g>
  <!-- chickpeas -->
  <g fill="#D9A441" stroke="#3A1F1A" stroke-width="3">
    <circle cx="200" cy="232" r="8"/>
    <circle cx="300" cy="215" r="8"/>
    <circle cx="395" cy="235" r="8"/>
    <circle cx="260" cy="262" r="7"/>
  </g>
  <!-- garlic head on top -->
  <g stroke="#3A1F1A" stroke-width="7" stroke-linejoin="round">
    <path d="M258 180 Q246 140 300 128 Q354 140 342 180 Q300 192 258 180 Z" fill="#FFFDF6"/>
    <path d="M300 128 L300 112" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#C9B89A" stroke-width="4" stroke-linecap="round">
    <path d="M300 136 L300 182"/>
    <path d="M284 138 Q268 160 278 182"/>
    <path d="M316 138 Q332 160 322 182"/>
  </g>

  <!-- kazan body -->
  <path d="M112 312 L488 312 Q478 478 300 486 Q122 478 112 312 Z" fill="#2E2A2B"/>
  <!-- shyrdak band with ram's horn ornaments -->
  <g clip-path="url(#pot)">
    <rect x="100" y="332" width="400" height="56" fill="#B3261E"/>
    <rect x="100" y="332" width="400" height="7" fill="#D9A441"/>
    <rect x="100" y="381" width="400" height="7" fill="#D9A441"/>
    <use xlink:href="#horn" x="150" y="362"/>
    <use xlink:href="#horn" x="210" y="362"/>
    <use xlink:href="#horn" x="270" y="362"/>
    <use xlink:href="#horn" x="330" y="362"/>
    <use xlink:href="#horn" x="390" y="362"/>
    <use xlink:href="#horn" x="450" y="362"/>
  </g>
  <path d="M112 312 L488 312 Q478 478 300 486 Q122 478 112 312 Z" fill="none" stroke="#3A1F1A" stroke-width="9" stroke-linejoin="round"/>
  <!-- rim -->
  <rect x="92" y="290" width="416" height="34" rx="17" fill="#1F8A8A" stroke="#3A1F1A" stroke-width="9"/>

  <!-- face -->
  <ellipse cx="255" cy="423" rx="11" ry="14" fill="#F4E6CC"/>
  <ellipse cx="345" cy="423" rx="11" ry="14" fill="#F4E6CC"/>
  <path d="M285 440 Q300 456 315 440" fill="none" stroke="#F4E6CC" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="222" cy="446" rx="16" ry="9" fill="#E36B6B" opacity="0.85"/>
  <ellipse cx="378" cy="446" rx="16" ry="9" fill="#E36B6B" opacity="0.85"/>

  <!-- steam -->
  <g fill="none" stroke="#C9A98B" stroke-width="7" stroke-linecap="round">
    <path d="M190 165 Q175 140 190 115 Q205 90 190 70"/>
    <path d="M410 165 Q395 140 410 115 Q425 90 410 70"/>
  </g>

</svg>
